# Renders the resume to PDF and emails it. Triggered manually from the
# Actions tab ("Run workflow") — run it when you actually want a fresh PDF.
#
# The script renders the local index.html, so this does not depend on
# GitHub Pages having rebuilt first.

name: html to pdf workflow

on:
  workflow_dispatch:

jobs:
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Action to clone your repository into the GitHub runner. This step replaces the git clone command
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Action to set up a Python environment. Specify the Python version you need (e.g., 3.9 or 3.x for the latest version).
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.x'

    # Installs the Python dependencies listed in your requirements.txt file using pip
    - name: Install dependencies
      run: |
        cd html-pdf-converter/
        pip install -r requirements.txt

    # Downloads the headless Chromium build Playwright uses to render the PDF
    - name: Install Playwright browser
      run: |
        cd html-pdf-converter/
        python3 -m playwright install --with-deps chromium

    # Executes a Python script
    - name: Run Python script
      run: |
        cd html-pdf-converter/
        python3 html-pdf-converter-email.py
    # Passes secrets as environment variables to Python script
      env:
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
